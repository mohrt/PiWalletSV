site_name: PiWalletSV
site_description: >
  Air-gapped Bitcoin SV signing device built on a Raspberry Pi, a TFT
  bonnet, and a Pi Camera, with a companion PWA for the online half.
site_url: !ENV [MKDOCS_SITE_URL, "https://piwalletsv.com/"]
# Source repo. mkdocs-material renders this as a "View on GitHub"
# button in the top-right of every page (icon + repo name) and lets
# the per-page "edit this page" pencil link to the matching markdown
# source on the default branch.
repo_url: https://github.com/mohrt/PiWalletSV
# Label shown next to the icon in the top-right repo button. Override
# the default "owner/repo" so the button reads as "GitHub" — the icon
# already identifies the host, the slug just adds noise.
repo_name: GitHub
edit_uri: edit/main/docs/
copyright: >
  Copyright &copy; PiWalletSV contributors. Licensed under MIT.
  Alpha software — see Disclaimer.

docs_dir: docs

# Files inside docs_dir that should NOT be rendered as standalone
# pages. Used for include-only fragments referenced by
# pymdownx.snippets (e.g. the abbreviations glossary).
exclude_docs: |
  includes/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  # Swap the default generic-git fork mark for the GitHub Octocat in
  # the top-right "Go to repository" button. mkdocs-material does NOT
  # auto-detect github.com hosts here — without this override the
  # button renders Font Awesome's plain git icon and reads as "some
  # git host", not "GitHub".
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Renders both Unicode emoji shortcodes (:smile:) and the
  # Material-bundled icon shortcodes (:material-shield-key:,
  # :fontawesome-brands-github:, etc.) as inline SVGs. Without this
  # extension those tokens leak through as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      # Appended to every page after its own content, so the `abbr`
      # extension picks up the project-wide *[ABBR]: definitions
      # without having to repeat them in every file.
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # Lets markdown bodies reference {{ companion_url }} so dev builds
  # link into the dev companion mirror and prod builds link to the
  # canonical companion. The variable values come from the `extra`
  # block below (env-overridable via PIWALLETSV_COMPANION_URL).
  - macros:
      on_undefined: strict

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/env-links.js

extra:
  generator: false
  # Cross-domain link target for the companion app. publish.sh sets
  # PIWALLETSV_COMPANION_URL=https://app.dev.piwalletsv.com when
  # building the dev mirror; otherwise this falls back to the
  # canonical prod host. Reference in markdown as {{ companion_url }}.
  companion_url: !ENV [PIWALLETSV_COMPANION_URL, "https://app.piwalletsv.com"]
  # Signed firmware on GitHub Releases — same URLs on dev and prod docs.
  firmware_version: !ENV [PIWALLETSV_FIRMWARE_VERSION, "0.1.0-r1"]
  firmware_github_tag: !ENV [PIWALLETSV_FIRMWARE_GITHUB_TAG, "v0.1.0-r1"]
  firmware_release_base: !ENV [PIWALLETSV_FIRMWARE_RELEASE_BASE, "https://github.com/mohrt/PiWalletSV/releases/download/v0.1.0-r1"]
  firmware_release_page: !ENV [PIWALLETSV_FIRMWARE_RELEASE_PAGE, "https://github.com/mohrt/PiWalletSV/releases/tag/v0.1.0-r1"]

nav:
  - Home: index.md
  - Setup:
      - Build from image:
          - Download image: download.md
          - Flash and first run: build-image.md
      - Build from scratch: getting-started.md
      - Purchase kit: purchase.md
  - User guide:
      - User manual: user-manual.md
      - Recover without device: recover-without-device.md
  - Operations:
      - Build & deploy: build.md
      - Operate: operate.md
      - CLI reference: cli.md
  - Reference:
      - Architecture: architecture.md
      - Security: security.md
      - BRC alignment: brc-alignment.md
      - Prior art: prior-art.md
      - Protocol spec:
          - Overview: protocol/README.md
          - Derivation: protocol/derivation.md
          - Envelopes: protocol/envelopes.md
          - QR transport: protocol/qr-transport.md
          - SPV requirements: protocol/spv.md
          - Conformance: protocol/conformance.md
  - Develop:
      - Developer guide: develop.md
      - Hardware tests:
          - Checkpoint 1 (bonnet boot path): hardware/checkpoint-1.md
          - Checkpoint 2 (word entry): hardware/checkpoint-2.md
          - Checkpoint 3 (testnet round-trip): hardware/checkpoint-3.md
  - Disclaimer: disclaimer.md
