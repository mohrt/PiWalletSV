[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piwallet"
version = "0.1.0a0"
description = "Air-gapped Bitcoin SV signing device for Raspberry Pi Zero 2 W + 1.3\" TFT bonnet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PiWalletSV contributors" }]
keywords = ["bitcoin-sv", "bsv", "wallet", "hardware-wallet", "air-gapped", "raspberry-pi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "bsv-sdk>=1.0.7",
    "cbor2>=5.6.0",
    "cryptography>=42.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
display = [
    "Pillow>=10.0.0",
    "adafruit-blinka>=8.0.0",
    "adafruit-circuitpython-rgb-display>=3.0.0",
]
camera = [
    "pyzbar>=0.1.9",
]

[project.scripts]
piwallet = "piwallet.cli:main"

[project.urls]
Homepage = "https://github.com/mohrt/PiWallet"
Issues = "https://github.com/mohrt/PiWallet/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["piwallet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "S105",  # hardcoded password fixtures (intentional in tests)
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802", "E501"]
"fixtures/*" = ["S"]
